{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Access</title>
    <link rel="stylesheet" href="{% static 'book/style.css' %}">
</head>
<body>
    <div class="glass-container">
        <h1>Library Login</h1>
        <p>Enter your email to access your personalized book collection.</p>
        
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
