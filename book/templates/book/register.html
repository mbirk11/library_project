{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Library</title>
    <link rel="stylesheet" href="{% static 'book/style.css' %}">
</head>
<body>
    <div class="glass-container">
        <h1>Join the Library</h1>
        <p>Complete your profile to unlock our curated collection.</p>
        
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Complete Registration</button>
        </form>
        <br>
        <p style="font-size: 0.9rem;">Already have an account? <a href="{% url 'index' %}" style="color: var(--primary);">Login here</a></p>
    </div>
</body>
</html>
